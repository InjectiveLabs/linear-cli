[workspace]
members = ["dist:."]


[package]
name = "linear"
description = "CLI to manage Linear issues, teams, and projects from the terminal."
version = "1.9.1-inj.1"
license = "MIT"
repository = "https://github.com/InjectiveLabs/linear-cli"
homepage = "https://github.com/InjectiveLabs/linear-cli"
binaries = ["linear"]
build-command = [
  "sh",
  "-c",
  "deno compile --target=$CARGO_DIST_TARGET -o linear --allow-all --quiet src/main.ts",
]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.2"
# Extra steps to run before dist builds in GitHub Actions.
github-build-setup = "build-setup.yml"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# Which actions to run on pull requests
# pr-run-mode = "upload"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = true
